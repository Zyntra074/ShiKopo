<script>
(()=>{
const root=document.getElementById('shikopo-concept');
const icons={character:'person-standing',visuals:'eye',world:'globe',players:'users',combat:'crosshair',library:'code-2',profiles:'folder-open',options:'sliders-horizontal'};
const tabs=[['character','Personagem','Movimento, mobilidade e utilidades.'],['visuals','Visuais','Informação visual, sem poluir a tela.'],['world','Mundo','Câmera, iluminação e pontos salvos.'],['players','Jogadores','Selecionar, observar e organizar.'],['combat','Combate','Controles organizados do ShiKopo.'],['library','Biblioteca','Módulos e espaço para scripts.'],['profiles','Perfis','Seu conjunto de preferências.'],['options','Opções','A interface do seu jeito.']];
const defaults={fly:false,noclip:false,speed:false,infiniteJump:false,float:false,antiAFK:false,shiftLock:false,respawn:false,flySpeed:45,walkSpeed:32,jumpPower:50,floatHeight:8,esp:true,box:true,names:true,health:true,tracer:false,chams:false,inventory:false,radar:false,alert:false,espDistance:1200,aimbot:false,aimTeam:true,aimVisible:true,sticky:false,autoShot:false,autoClick:false,hitbox:false,fov:90,smooth:35,clickDelay:100,hitboxSize:5,freecam:false,clickTP:false,fovOn:false,cameraFov:70,freecamSpeed:1.5,lighting:false,time:16,brightness:2,spectate:false};
const keyDefaults={fly:'F',noclip:'Z',speed:'V',freecam:'I',aimbot:'Mouse2',autoClick:'E',menu:'Shift direito'};
const people=[{name:'Astra',handle:'astra_demo',team:'Exploradores',distance:28,health:100,x:28,y:4,z:-36},{name:'Nova',handle:'nova_demo',team:'Construtores',distance:64,health:84,x:-64,y:12,z:25},{name:'Pixel',handle:'pixel_demo',team:'Exploradores',distance:112,health:65,x:112,y:6,z:18},{name:'Mika',handle:'mika_demo',team:'Visitantes',distance:185,health:100,x:-185,y:2,z:-75}];
const labels={fly:'Voo',noclip:'Noclip',speed:'Velocidade',infiniteJump:'Pulo infinito',float:'Flutuar',antiAFK:'Anti-AFK',shiftLock:'Shift Lock',respawn:'Retornar ao morrer',esp:'ESP',box:'Caixas',names:'Nomes',health:'Vida',tracer:'Linhas',chams:'Silhueta',inventory:'Inventário',radar:'Minimapa',alert:'High Alert',aimbot:'Aimbot',aimTeam:'Filtrar aliados',aimVisible:'Checar visibilidade',sticky:'Manter alvo',autoShot:'AutoShot',autoClick:'Auto Click',hitbox:'Hitbox',freecam:'Câmera livre',clickTP:'Teleporte por clique',fovOn:'Campo de visão',lighting:'Iluminação personalizada',spectate:'Espectador'};
const parseSaved=()=>window.openai?.widgetState?.privateContent?.shikopoConcept||{};
let saved=parseSaved();const instances=[];
const icon=(name)=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
const escape=(text)=>String(text).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const prettyKey=(k)=>({ShiftRight:'Shift direito',ControlLeft:'Ctrl',Space:'Espaço',Mouse2:'Mouse2'}[k]||k.replace(/^Key|^Digit/,''));
function persist(){if(!window.openai?.setWidgetState)return;const state={};for(const app of instances)state[app.id]=app.export();window.openai.setWidgetState({modelContent:{prototype:'ShiKopo',views:instances.map(app=>({layout:app.id,tab:app.state.tab,active:Object.keys(labels).filter(k=>app.state.controls[k]),selectedPlayer:people[app.state.player].name}))},privateContent:{shikopoConcept:state}}).catch(()=>{});}
class App{
constructor(id){this.id=id;this.el=document.getElementById(id);const old=saved[id]||{};this.state={tab:'character',controls:{...defaults},keys:{...keyDefaults},player:0,playerMode:'players',positions:{x:0,y:4,z:0},waypoints:[{name:'Ponto inicial',x:0,y:4,z:0},{name:'Mirante',x:85,y:32,z:-42}],profiles:[],message:'Prévia pronta. Explore os controles.',theme:'dark',accent:'#d4d7df',radius:12,gap:12,minimized:false,relations:{},...old,controls:{...defaults,...old.controls},keys:{...keyDefaults,...old.keys}};this.capture=null;this.create();this.render();this.bind();this.observe=new ResizeObserver(()=>this.drawScene());this.observe.observe(this.el);}
export(){const {tab,controls,keys,player,playerMode,positions,waypoints,profiles,theme,accent,radius,gap,minimized,relations,espColor,tpMethod,aimPart,hitboxFilter,boxStyle}=this.state;return{tab,controls,keys,player,playerMode,positions,waypoints:waypoints.slice(0,12),profiles:profiles.slice(0,6),theme,accent,radius,gap,minimized,relations,espColor,tpMethod,aimPart,hitboxFilter,boxStyle};}
create(){this.el.innerHTML='<div class="sk-window"><header class="sk-titlebar"><span class="sk-symbol">s</span><span class="sk-brand">ShiKopo</span><span class="sk-title-sub">'+(this.id==='sk-workspace'?'workspace':'interface')+'</span><span class="sk-pill">Conceito</span><span class="sk-status">Simulação local</span><button type="button" class="sk-key" data-action="minimize" aria-label="Ocultar ou mostrar a interface">−</button></header><div class="sk-main"><div class="sk-body"><nav class="sk-nav" aria-label="Módulos do ShiKopo">'+tabs.map(([id,label])=>'<button type="button" class="sk-nav-button" data-tab="'+id+'" aria-pressed="false">'+icon(icons[id])+label+'</button>').join('')+'<span class="sk-nav-foot">Uma interface.<br>Seu espaço de controle.</span></nav><main class="sk-content"><div class="sk-heading"><div><h2></h2><p></p></div><span class="sk-pill">Prévia interativa</span></div><div class="sk-content-grid"><div class="sk-settings"></div><aside class="sk-inspector" aria-label="Prévia e atalhos"><div class="sk-panel sk-scene-panel"><div class="sk-scene-top"><span data-scene-title>Prévia do personagem</span><span class="sk-caption">Demonstração</span></div><canvas class="sk-scene" aria-label="Personagem demonstrativo e efeito das opções selecionadas" role="img"></canvas><div class="sk-scene-bottom"><div class="sk-coords"><span data-coords></span><span data-camera>Local</span></div><div class="sk-tag-list"></div></div></div><div class="sk-panel sk-hotkeys"><h3>'+icon('keyboard')+'Atalhos ativos</h3><div data-hotkeys></div><div class="sk-note">'+escape(this.state.keys.menu)+' abre e fecha o menu.</div></div></aside></div></main></div><footer class="sk-live"><span data-message aria-live="polite"></span><span>ShiKopo / conceito visual</span></footer></div><div class="sk-minimized" hidden><p>ShiKopo está minimizado.</p><button class="sk-action" type="button" data-action="minimize">Abrir interface</button></div></div><div class="sk-dock" aria-label="Barra rápida">'+ render(){const s=this.state,c=s.controls;this.el.dataset.theme=s.theme;this.el.style.setProperty('--sk-accent',s.accent);this.el.style.setProperty('--sk-radius',s.radius+'px');this.el.style.setProperty('--sk-gap',s.gap+'px');const tab=tabs.find(t=>t[0]===s.tab)||tabs[0];this.el.querySelector('h2').textContent=tab[1];this.el.querySelector('.sk-heading p').textContent=tab[2];this.el.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===s.tab;b.setAttribute('aria-pressed',active);});const area=this.el.querySelector('.sk-settings');area.innerHTML=this.content();this.el.querySelector('.sk-main').hidden=s.minimized;this.el.querySelector('.sk-minimized').hidden=!s.minimized;this.renderFeedback();this.icons();this.drawScene();}

if(s.tab==='library')return this.library();

return'<div class="sk-stack">'+this.panel('Interface',this.select('Aparência','theme',['Escuro','Claro'],s.theme==='dark'?'Escuro':'Claro')+'<label class="sk-field">Destaque<input class="sk-color" type="color" data-color="accent" value="'+s.accent+'"></label>'+this.check('decorations','Efeitos decorativos')+'<p class="sk-note">Uma base discreta, com destaque só onde importa.</p>','palette')+this.panel('Atalho do menu','<div class="sk-row"><span>Mostrar / ocultar</span><button class="sk-key" data-key="menu" type="button">'+escape(s.keys.menu)+'</button></div>','keyboard')+'</div><div class="sk-stack">'+this.panel('Preferências','<div class="sk-actions">'+this.action('Parar todos','stopAll')+this.action('Restaurar padrão','reset')+'</div>','sliders-horizontal')+this.panel('ShiKopo','<div class="sk-facts"><span>Experiência</span><span>Protótipo visual</span></div><div class="sk-facts"><span>Conexão</span><span>Sem Roblox conectado</span></div><p class="sk-note">Nesta etapa, módulos e posições são demonstrativos.</p>','info')+'</div>';

library(){const s=this.state;const list=[['Voo','Mobilidade · proposto','character'],['Noclip','Mobilidade · proposto','character'],['ESP e High Alert','Visual · recurso atual','visuals'],['Teleporte','Jogadores · recurso atual','players'],['Espectador','Câmera · proposto','players'],['Minimapa','Visual · recurso atual','visuals']];return'<div class="sk-stack">'+this.panel('Catálogo',list.map(([name,note,tab])=>'<div class="sk-library-item"><div>'+name+'<small>'+note+'</small></div><button type="button" class="sk-key" data-tab="'+tab+'">Abrir</button></div>').join(''),'blocks')+'</div><div class="sk-stack">'+this.panel('Rascunho de script',''+this.select('Modelo','snippet',['Boas-vindas','Mensagem de status'],s.snippet||'Boas-vindas')+'<textarea class="sk-editor" aria-label="Rascunho de script" spellcheck="false">'+escape(s.draft||'-- ShiKopo / rascunho\nprint("Olá, ShiKopo!")')+'</textarea><div class="sk-actions">'+this.action('Simular execução','simulateScript',true)+this.action('Limpar saída','clearConsole')+'</div><div class="sk-console" aria-live="polite">'+escape(s.console||'Nenhuma simulação executada.')+'</div><p class="sk-note">O rascunho não é executado nem injetado.</p>','code-2')+'</div>';}
renderFeedback(){const s=this.state,c=s.controls;this.el.querySelector('[data-message]').textContent=s.message;this.el.querySelector('[data-coords]').textContent='X '+s.positions.x+' · Y '+s.positions.y+' · Z '+s.positions.z;this.el.querySelector('[data-camera]').textContent=c.spectate?'Observando '+this.target().name:c.freecam?'Câmera livre':'Câmera local';this.el.querySelector('[data-scene-title]').textContent=c.spectate?'Espectador · '+this.target().name:'Prévia do personagem';const actives=Object.keys(labels).filter(k=>c[k]&&!['box','names','health','aimTeam','aimVisible'].includes(k));this.el.querySelector('.sk-tag-list').innerHTML=actives.length?actives.slice(0,7).map(k=>'<span class="sk-tag">'+labels[k]+'</span>').join(''):'<span class="sk-caption">Nenhum módulo ativo</span>';const binds=Object.entries(s.keys).filter(([k])=>k!=='menu'&&c[k]);this.el.querySelector('.sk-hotkeys .sk-note').textContent=s.keys.menu+' abre e fecha o menu.';this.el.querySelector('[data-hotkeys]').innerHTML=binds.length?binds.map(([k,v])=>'<div class="sk-hotkey-list"><span>'+labels[k]+'</span><span class="sk-key">'+escape(v)+'</span></div>').join(''):'<div class="sk-empty">Ative um módulo para vê-lo aqui.</div>';this.el.querySelectorAll('[data-control]').forEach(el=>{if(el.type==='checkbox')el.checked=!!c[el.dataset.control];});this.drawScene();}
message(text){this.state.message=text;this.renderFeedback();}
bind(){this.el.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){this.state.tab=tab.dataset.tab;this.state.minimized=false;this.render();persist();return;}const bind=e.target.closest('[data-key]');if(bind){this.capture=bind.dataset.key;bind.textContent='Tecla…';bind.classList.add('is-capturing');this.message('Pressione uma tecla. Esc cancela.');return;}const mode=e.target.closest('[data-player-mode]');if(mode){this.state.playerMode=mode.dataset.playerMode;this.render();persist();return;}const p=e.target.closest('[data-person]');if(p){this.state.player=Number(p.dataset.person);this.render();persist();return;}const team=e.target.closest('[data-team]');if(team){const k=team.dataset.team;this.state.relations[k]=this.state.relations[k]==='Aliado'?'Neutro':'Aliado';this.render();persist();return;}const action=e.target.closest('[data-action]');if(action)this.actionClick(action.dataset.action,Number(action.dataset.index));});this.el.addEventListener('input',e=>{const el=e.target;if(el.dataset.control){const k=el.dataset.control;this.state.controls[k]=el.type==='checkbox'?el.checked:Number(el.value);const output=this.el.querySelector('[data-value="'+k+'"]');if(output)output.textContent=el.value+(el.dataset.unit||'');this.message((labels[k]||el.getAttribute('aria-label')||k)+(el.type==='checkbox'?(el.checked?' ativado.':' desativado.'):' ajustado.'));persist();}if(el.dataset.color){this.state[el.dataset.color]=el.value;this.el.style.setProperty('--sk-accent',this.state.accent);this.drawScene();persist();}if(el.dataset.field==='playerSearch'){const query=el.value.toLowerCase();this.el.querySelectorAll('.sk-person').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(query));}if(el.classList.contains('sk-editor'))this.state.draft=el.value;});this.el.addEventListener('change',e=>{const el=e.target;if(!el.dataset.select)return;const key=el.dataset.select;if(key==='theme')this.state.theme=el.value==='Claro'?'light':'dark';else if(key==='relation')this.state.relations[this.target().name]=el.value;else if(key==='snippet'){this.state.snippet=el.value;this.state.draft=el.value==='Boas-vindas'?'-- ShiKopo / rascunho\nprint("Olá, ShiKopo!")':'-- ShiKopo / rascunho\nprint("Perfil de exploração selecionado")';}else this.state[key]=el.value;this.render();persist();});}
actionClick(action,index){const s=this.state,c=s.controls;let rerender=false;switch(action){case'minimize':s.minimized=!s.minimized;rerender=true;break;case'saveSpot':s.lastSpot={...s.positions};this.message('Posição atual guardada.');break;case'returnSpot':s.positions={...(s.lastSpot||{x:0,y:4,z:0})};this.message('Prévia retornou à posição guardada.');break;case'returnHome':s.positions={x:0,y:4,z:0};this.message('Prévia na posição inicial.');break;case'newWaypoint':{const input=this.el.querySelector('[data-field="waypointName"]');const name=input.value.trim();if(!name){this.message('Dê um nome ao ponto antes de criar.');input.focus();return;}if(s.waypoints.length>=12){this.message('Limite de 12 pontos nesta prévia.');return;}s.waypoints.push({name,...s.positions});s.message='Ponto “'+name+'” criado.';rerender=true;break;}case'goWaypoint':s.positions={x:s.waypoints[index].x,y:s.waypoints[index].y,z:s.waypoints[index].z};this.message('Prévia movida para '+s.waypoints[index].name+'.');break;case'deleteWaypoint':s.waypoints.splice(index,1);rerender=true;break;case'teleportPlayer':{const p=this.target();s.positions={x:p.x,y:p.y,z:p.z};this.message('Teleporte demonstrativo para '+p.name+'.');break;}case'spectatePlayer':c.spectate=!c.spectate;this.message(c.spectate?'Observando '+this.target().name+' na prévia.':'Câmera local restaurada.');rerender=true;break;case'stopSpectate':c.spectate=false;c.freecam=false;this.message('Câmera local restaurada.');break;case'saveProfile':{const input=this.el.querySelector('[data-field="profileName"]');const name=input.value.trim();if(!name){this.message('Digite um nome para o perfil.');input.focus();return;}const profile={name,controls:{...c},keys:{...s.keys}};const match=s.profiles.findIndex(p=>p.name===name);if(match>=0)s.profiles[match]=profile;else if(s.profiles.length<6)s.profiles.push(profile);else{this.message('Limite de seis perfis nesta prévia.');return;}s.message='Perfil “'+name+'” salvo nesta prévia.';rerender=true;break;}case'loadProfile':s.controls={...defaults,...s.profiles[index].controls};s.keys={...keyDefaults,...s.profiles[index].keys};s.message='Perfil “'+s.profiles[index].name+'” carregado.';rerender=true;break;case'deleteProfile':s.profiles.splice(index,1);rerender=true;break;case'presetExplore':s.controls={...defaults,fly:true,noclip:true,radar:true,esp:false};s.message='Preset Exploração aplicado.';rerender=true;break;case'presetMinimal':s.controls={...defaults,esp:false,box:false,names:false,health:false};s.message='Preset Minimalista aplicado.';rerender=true;break;case'stopAll':Object.keys(c).forEach(k=>{if(typeof c[k]==='boolean')c[k]=false;});s.message='Todos os módulos da prévia foram desativados.';rerender=true;break;case'reset':s.controls={...defaults};s.message='Preferências padrão restauradas.';rerender=true;break;case'simulateScript':s.console='[prévia] Rascunho recebido.\n[prévia] '+(s.draft||'print("Olá, ShiKopo!")').split('\n').length+' linha(s) no editor.\n[prévia] Simulação concluída. Nenhum código foi executado.';s.message='Simulação do editor concluída.';rerender=true;break;case'clearConsole':s.console='Saída limpa.';rerender=true;break;}if(rerender)this.render();persist();}
key(event){if(this.capture){event.preventDefault();const key=this.capture;this.capture=null;if(event.code!=='Escape')this.state.keys[key]=prettyKey(event.code);this.state.message=event.code==='Escape'?'Captura cancelada.':'Atalho atualizado.';this.render();persist();return;}if(['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName)||event.repeat)return;const pressed=prettyKey(event.code);if(pressed===this.state.keys.menu){event.preventDefault();this.actionClick('minimize',0);return;}for(const [k,v]of Object.entries(this.state.keys)){if(k!=='menu'&&v===pressed){event.preventDefault();this.state.controls[k]=!this.state.controls[k];this.message(labels[k]+(this.state.controls[k]?' ativado.':' desativado.'));this.render();persist();return;}}}
icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}});}
drawScene(){const canvas=this.el.querySelector('canvas');if(!canvas)return;const width=canvas.clientWidth,height=canvas.clientHeight;if(!width)return;const ratio=window.devicePixelRatio||1;canvas.width=width*ratio;canvas.height=height*ratio;const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);const s=this.state,c=s.controls;const dark=s.theme!=='light';const bg=ctx.createLinearGradient(0,0,0,height);bg.addColorStop(0,dark?'#0c1019':'#e8edf5');bg.addColorStop(1,dark?'#1b202b':'#bfcbdc');ctx.fillStyle=bg;ctx.fillRect(0,0,width,height);const ground=height*.78;ctx.strokeStyle=dark?'#303847':'#a2afc2';ctx.lineWidth=.7;for(let i=-7;i<8;i++){ctx.beginPath();ctx.moveTo(width/2+i*22,ground-28);ctx.lineTo(width/2+i*50,height);ctx.stroke();}for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(0,ground+i*i*3);ctx.lineTo(width,ground+i*i*3);ctx.stroke();}const center=width/2+(s.positions.x%50)*.5;const lift=c.fly?38:c.float?Number(c.floatHeight)*1.6:0;const base=ground-lift;const scale=Math.min(width/240,1.25)*(c.freecam ? .82 : 1);const part=(x,y,w,h,color,depth=7)=>{ctx.fillStyle=color;ctx.fillRect(center+x*scale,base+y*scale,w*scale,h*scale);ctx.fillStyle=dark?'#768397':'#8394ad';ctx.globalAlpha=.35;ctx.beginPath();ctx.moveTo(center+(x+w)*scale,base+y*scale);ctx.lineTo(center+(x+w+depth)*scale,base+(y-depth*.6)*scale);ctx.lineTo(center+(x+w+depth)*scale,base+(y+h-depth*.6)*scale);ctx.lineTo(center+(x+w)*scale,base+(y+h)*scale);ctx.closePath();ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=dark?'#d3d9e3':'#dce3f0';ctx.globalAlpha=.15;ctx.beginPath();ctx.moveTo(center+x*scale,base+y*scale);ctx.lineTo(center+(x+depth)*scale,base+(y-depth*.6)*scale);ctx.lineTo(center+(x+w+depth)*scale,base+(y-depth*.6)*scale);ctx.lineTo(center+(x+w)*scale,base+y*scale);ctx.closePath();ctx.fill();ctx.globalAlpha=1;};ctx.fillStyle=dark?'#06080c55':'#46516b22';ctx.beginPath();ctx.ellipse(center+3,ground+2,34*scale,9,0,0,Math.PI*2);ctx.fill();if(c.noclip)ctx.globalAlpha=.55;const torso=c.chams?'#a8bbcd':s.accent;part(-19,-92,38,44,torso);part(-37,-90,16,43,dark?'#858fa1':'#8a97ac');part(21,-90,16,43,dark?'#858fa1':'#8a97ac');part(-18,-46,16,44,dark?'#687589':'#677992');part(3,-46,16,44,dark?'#687589':'#677992');part(-13,-122,27,28,dark?'#bac5d4':'#a7b9cf',6);ctx.globalAlpha=1;ctx.fillStyle='#2a3444';ctx.fillRect(center-5*scale,base-112*scale,2,2);ctx.fillRect(center+5*scale,base-112*scale,2,2);if(c.esp){ctx.strokeStyle=s.espColor||'#c6cfda';ctx.lineWidth=1.2;const x=center-45*scale,y=base-137*scale,w=96*scale,h=141*scale;if(c.box){if(s.boxStyle==='Completa'){ctx.strokeRect(x,y,w,h);}else{const d=12;[[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([a,b,sx,sy])=>{ctx.beginPath();ctx.moveTo(a,b+sy*d);ctx.lineTo(a,b);ctx.lineTo(a+sx*d,b);ctx.stroke();});}}if(c.names){ctx.fillStyle=dark?'#e3e6ed':'#242c3e';ctx.font='11px -apple-system,Segoe UI,sans-serif';ctx.textAlign='center';ctx.fillText(c.spectate?this.target().name:'ShiKopo · você',center,y-9);}if(c.health){ctx.fillStyle='#35433f';ctx.fillRect(x-7,y,3,h);ctx.fillStyle='#8ebba9';ctx.fillRect(x-7,y+10,3,h-10);}if(c.tracer){ctx.strokeStyle=s.espColor||'#c6cfda';ctx.beginPath();ctx.moveTo(width/2,height);ctx.lineTo(center,base);ctx.stroke();}if(c.inventory){ctx.fillStyle=dark?'#bdc5d1':'#374459';ctx.textAlign='center';ctx.fillText('Ferramenta de treino',center,base+19);}}if(c.fovOn||c.aimbot){ctx.strokeStyle=s.accent;ctx.globalAlpha=.45;ctx.beginPath();ctx.arc(width/2,height/2,Math.min(Number(c.fov)*.5,width*.43),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}if(c.noclip){ctx.setLineDash([3,4]);ctx.strokeStyle=s.accent;ctx.strokeRect(center-40*scale,base-100*scale,84*scale,60*scale);ctx.setLineDash([]);}if(c.fly||c.speed){ctx.strokeStyle=s.accent;ctx.globalAlpha=.5;const distance=(c.fly?Number(c.flySpeed):Number(c.walkSpeed))*.15;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(center-53-distance,base-65+i*15);ctx.lineTo(center-43,base-65+i*15);ctx.stroke();}ctx.globalAlpha=1;}if(c.radar){ctx.strokeStyle='#78899b';ctx.strokeRect(width-52,13,38,38);ctx.fillStyle=s.accent;ctx.fillRect(width-34,30,3,3);ctx.fillStyle='#8ebba9';ctx.fillRect(width-22,22,3,3);}if(c.lighting){ctx.fillStyle='rgba(235,189,123,'+Math.min(.25,Number(c.brightness)*.035)+')';ctx.fillRect(0,0,width,height);if(Number(c.time)<6||Number(c.time)>19){ctx.fillStyle='rgba(1,4,15,.3)';ctx.fillRect(0,0,width,height);}}}
}
function captureSpectate(s){return s.controls.spectate?'Parar de observar':'Espectar';}
instances.push(new App('sk-workspace'),new App('sk-compact'));
document.addEventListener('keydown',event=>{const app=instances.find(a=>!a.el.closest('[data-variant]').hidden);if(app)app.key(event);});
window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState?.privateContent?.shikopoConcept;if(!next)return;for(const app of instances){const v=next[app.id];if(v){Object.assign(app.state,v,{controls:{...defaults,...v.controls},keys:{...keyDefaults,...v.keys}});app.render();}}});
if(globalThis.Tweak){for(const app of instances){const tweak=new Tweak({container:app.el,onChange:()=>app.render()});tweak.addColorPicker(app.state,'accent',{label:'Cor de destaque',reference:'--sk-accent'});tweak.addSlider(app.state,'radius',{label:'Arredondamento',min:6,max:18,step:1,unit:'px'});tweak.addSlider(app.state,'gap',{label:'Espaçamento',min:8,max:18,step:1,unit:'px'});}}
})();
</script>
